<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดวัตถุดิบ - หมูกระทะย่างให้</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #12080a;
            --card-bg: #1c1013;
            --card-border: #3d1c24;
            --maroon-accent: #8b0000;
            --gold-light: #ffd700;
            --text-main: #ffffff;
            --text-sub: #d1c4c6;
        }

        * { box-sizing: border-box; transition: all 0.25s ease; }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(218, 41, 28, 0.2), transparent 60%),
                linear-gradient(rgba(18, 8, 10, 0.92), rgba(18, 8, 10, 0.96)),
                url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        nav { 
            background: rgba(28, 16, 19, 0.92);
            backdrop-filter: blur(10px);
            padding: 16px 30px; 
            display: flex; 
            justify-content: center; 
            gap: 35px; 
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
            border-bottom: 2px solid var(--maroon-accent);
        }
        nav a { color: var(--text-sub); text-decoration: none; font-weight: 500; font-size: 17px; }
        nav a:hover, nav a.active { color: var(--gold-light); }

        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            text-align: center;
        }

        .product-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid var(--card-border);
        }

        h1 { color: #ffffff; font-size: 2.2rem; margin-bottom: 10px; }
        .price-tag { color: var(--gold-light); font-size: 1.8rem; font-weight: 700; margin-bottom: 25px; }

        .ingredients-box {
            background: #12080a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 25px;
            text-align: left;
            margin-bottom: 30px;
        }
        .ingredients-box h3 { color: var(--gold-light); margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
        .ingredients-box ul { margin: 0; padding-left: 20px; color: var(--text-sub); line-height: 1.8; font-size: 1.05rem; }
        .ingredients-box ul li { margin-bottom: 8px; color: #ffffff; }

        .btn-group { display: flex; gap: 15px; }
        .btn-back {
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }
        .btn-back:hover { background: rgba(255,255,255,0.2); }

        .btn-add {
            background: linear-gradient(135deg, #d32f2f, #8b0000);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            flex: 2;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }
        .btn-add:hover { background: linear-gradient(135deg, #e53935, #b71c1c); }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">🏠 หน้าแรก</a>
        <a href="products.html" class="active">🍖 เมนูอาหาร</a>
        <a href="checkout.html">🛒 ตะกร้าสินค้า</a>
        <a href="admin.html">⚙️ จัดการระบบ</a>
    </nav>

    <div class="container" id="detail-container">
        <!-- ข้อมูลรายละเอียดจะถูกโหลดมาแสดงที่นี่อัตโนมัติตาม ID ที่กดเข้ามา -->
    </div>

    <script>
        // ฐานข้อมูลรายละเอียดวัตถุดิบของแต่ละเซ็ตหมูกระทะ
        const productDetails = {
            "1": {
                name: "🐷 เซ็ตหมูกระทะ เล็ก",
                price: 79,
                img: "menu1.jpg",
                desc: "เหมาะสำหรับทานคนเดียว อิ่มกำลังดี สดสะอาด น้ำจิ้มสูตรเด็ด",
                ingredients: [
                    "หมูหมักนุ่มสูตรพิเศษ (200 กรัม)",
                    "ตับหมูสดสะอาด (50 กรัม)",
                    "ชุดผักสด (ผักกาดขาว, กะหล่ำปลี, ขึ้นฉ่าย)",
                    "วุ้นเส้นสด (1 ห่อเล็ก)",
                    "ไข่ไก่สด (1 ฟอง)",
                    "น้ำจิ้มสูตรเด็ดของทางร้าน (1 ขวดพกพา)"
                ]
            },
            "2": {
                name: "🔥 เซ็ตหมูกระทะ กลาง",
                price: 99,
                img: "menu2.jpg",
                desc: "เซ็ตยอดฮิต สำหรับทาน 1-2 คน จัดเต็มความอร่อยคุ้มค่า",
                ingredients: [
                    "หมูหมักนุ่ม + สามชั้นสไลด์รวมกัน (350 กรัม)",
                    "ตับหมูและหัวใจหมู (80 กรัม)",
                    "ลูกชิ้นปลาและเต้าหู้ปลา (อย่างละ 4 ลูก)",
                    "ชุดผักสดถาดกลาง (ผักกาดขาว, กะหล่ำปลี, ข้าวโพดอ่อน, เห็ดเข็มทอง)",
                    "วุ้นเส้น และ บะหมี่กึ่งสำเร็จรูป (อย่างละ 1 ห่อ)",
                    "ไข่ไก่สด (2 ฟอง)",
                    "น้ำจิ้มสูตรเด็ด (2 ขวดโต)"
                ]
            },
            "3": {
                name: "🦐 เซ็ตหมูกระทะ ใหญ่จัดเต็ม",
                price: 129,
                img: "menu3.jpg",
                desc: "เซ็ตใหญ่จุใจ ทานได้ 2-3 คน พร้อมซีฟู้ดสดใหม่และเครื่องเคียงแน่นๆ",
                ingredients: [
                    "หมูหมักนุ่มพิเศษ และ สามชั้นสไลด์หนานุ่ม (รวม 500 กรัม)",
                    "ซีฟู้ดสด (กุ้งสด และ ปลาหมึกสด)",
                    "ตับหมู และลูกชิ้นพรีเมียมหลากหลายชนิด",
                    "ชุดผักสดถาดใหญ่พิเศษ และชุดเห็ดรวม",
                    "วุ้นเส้น, บะหมี่กึ่งสำเร็จรูป, และไข่ไก่สด (2 ฟอง)",
                    "น้ำจิ้มสูตรเด็ด (ขวดใหญ่จุใจ)"
                ]
            }
        };

        // ดึงค่า ID จาก URL เช่น product-detail.html?id=1
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id') || '1';
        const product = productDetails[productId];

        const container = document.getElementById('detail-container');

        if (product) {
            let ingredientsHtml = '';
            product.ingredients.forEach(ing => {
                ingredientsHtml += `<li>✨ ${ing}</li>`;
            });

            container.innerHTML = `
                <img src="${product.img}" alt="${product.name}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=500&auto=format&fit=crop'">
                <h1>${product.name}</h1>
                <div class="price-tag">${product.price} บาท</div>
                <p style="color:var(--text-sub); margin-bottom: 25px; font-size: 1.1rem;">${product.desc}</p>
                
                <div class="ingredients-box">
                    <h3>📋 รายละเอียดวัตถุดิบภายในเซ็ต</h3>
                    <ul>
                        ${ingredientsHtml}
                    </ul>
                </div>

                <div class="btn-group">
                    <a href="products.html" class="btn-back">⬅️ กลับไปหน้าเมนู</a>
                    <button class="btn-add" onclick="addToCart('${product.name}', ${product.price})">🛒 เพิ่มลงตะกร้า (${product.price} ฿)</button>
                </div>
            `;
        } else {
            container.innerHTML = `<h2>❌ ไม่พบข้อมูลสินค้า</h2><a href="products.html" class="btn-back" style="display:inline-block; margin-top:20px;">กลับไปหน้าเมนู</a>`;
        }

        function addToCart(name, price) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({ name: name, price: price, baseName: name });
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('เพิ่ม "' + name + '" ลงในตะกร้าเรียบร้อยแล้ว!');
            window.location.href = 'products.html';
        }
    </script>
</body>
</html>
