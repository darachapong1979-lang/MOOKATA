<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดวัตถุดิบ - หมูกระทะย่างให้</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #fdf2e9; margin: 0; padding: 0; text-align: center; }
        
        nav { background-color: #d32f2f; padding: 15px; display: flex; justify-content: center; gap: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav a { color: white; text-decoration: none; font-weight: bold; font-size: 18px; }
        nav a:hover { text-decoration: underline; }

        .detail-box { background: white; max-width: 500px; margin: 30px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: left; }
        .detail-box img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; }
        
        .title { color: #d32f2f; margin-top: 15px; font-size: 24px; }
        .price-tag { font-size: 22px; color: #e65100; font-weight: bold; margin-bottom: 10px; }
        
        .portion-info { background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; border-left: 5px solid #4caf50; font-size: 16px; }

        .ingredients-list { background: #fff8e1; padding: 15px 20px; border-radius: 8px; margin: 15px 0; border-left: 5px solid #ff9800; }
        .ingredients-list ul { margin: 8px 0 0 20px; padding: 0; }
        .ingredients-list li { margin-bottom: 8px; font-size: 15px; color: #444; line-height: 1.4; }

        .btn-add { background-color: #e65100; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-add:hover { background-color: #bf360c; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #0288d1; text-decoration: none; font-weight: bold; font-size: 16px; }
        .btn-back:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="products.html">🍖 Menu</a>
        <a href="checkout.html">🛒 Cart & Checkout</a>
    </nav>

    <div class="detail-box">
        <img id="item-img" src="" alt="รูปสินค้า">
        <h2 id="item-title" class="title"></h2>
        <div id="item-price" class="price-tag"></div>

        <div id="item-portion" class="portion-info"></div>

        <h3>📦 รายละเอียดวัตถุดิบในเซ็ต:</h3>
        <div class="ingredients-list">
            <ul id="item-ingredients"></ul>
        </div>

        <button class="btn-add" onclick="addCurrentToCart()">🛒 เพิ่มเซ็ตนี้ลงตะกร้า</button>
        <a href="products.html" class="btn-back">⬅️ กลับไปหน้าเลือกสินค้า</a>
    </div>

    <script>
        const productsData = {
            "1": {
                name: "🐷 เซ็ตหมูกระทะ เล็ก",
                price: 79,
                img: "menu1.jpg",
                portion: "👥 เหมาะสำหรับ: ทาน 1-2 คน แบบพอดีอิ่ม",
                ingredients: [
                    "หมูหมักสูตรเด็ด (200 กรัม) - นุ่ม หอม กลมกล่อม",
                    "ตับหมูสด (50 กรัม)",
                    "ชุดผักสดรวม (ผักกาดขาว, ผักบุ้ง, กะหล่ำปลีซอย)",
                    "วุ้นเส้นสด 1 ถุง",
                    "น้ำจิ้มหมูกระทะสูตรโบราณ (100 ml)",
                    "น้ำซุปรสกลมกล่อม 1 ถุง"
                ]
            },
            "2": {
                name: "🔥 เซ็ตหมูกระทะ กลาง",
                price: 99,
                img: "menu2.jpg",
                portion: "👥 เหมาะสำหรับ: ทาน 2-3 คน อิ่มกำลังดี",
                ingredients: [
                    "หมูหมักนุ่ม + หมูสามชั้นหมัก (350 กรัม)",
                    "ตับหมูสด + เต้าหู้ปลา + ปูอัดเกรด A",
                    "ชุดผักสดจัดเต็ม (ผักกาดขาว, ผักบุ้ง, ขึ้นฉ่าย, กะหล่ำปลี)",
                    "วุ้นเส้นสด + ไข่ไก่สด 1 ฟอง",
                    "น้ำจิ้มหมูกระทะสูตรเด็ด (200 ml)",
                    "น้ำซุปรสกลมกล่อม 1 ถุง"
                ]
            },
            "3": {
                name: "🦐 เซ็ตหมูกระทะ ใหญ่จัดเต็ม",
                price: 129,
                img: "menu3.jpg",
                portion: "👥 เหมาะสำหรับ: ทาน 3-4 คน อิ่มคุ้มทั้งแก๊ง",
                ingredients: [
                    "หมูหมักนุ่ม + สามชั้น + หมูหมักงา (500 กรัม)",
                    "ซีฟู้ดและลูกชิ้น (กุ้งสด, ปลาหมึกกรอบ, เต้าหู้ปลา, ปูอัด, ตับหมู)",
                    "ชุดผักสดถาดใหญ่ + เห็ดเข็มทอง",
                    "วุ้นเส้นสด 2 ถุง + ไข่ไก่สด 2 ฟอง",
                    "น้ำจิ้มหมูกระทะจุใจ (300 ml)",
                    "น้ำซุปรสกลมกล่อม 2 ถุงใหญ่"
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id') || "1";
        const currentItem = productsData[productId];

        document.getElementById('item-img').src = currentItem.img;
        document.getElementById('item-title').textContent = currentItem.name;
        document.getElementById('item-price').textContent = "ราคา: " + currentItem.price + " บาท";
        document.getElementById('item-portion').textContent = currentItem.portion;

        const ingList = document.getElementById('item-ingredients');
        currentItem.ingredients.forEach(item => {
            const li = document.createElement('li');
            li.textContent = "✔ " + item;
            ingList.appendChild(li);
        });

        function addCurrentToCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({ name: currentItem.name, price: currentItem.price });
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('เพิ่ม ' + currentItem.name + ' ลงตะกร้าเรียบร้อยแล้ว!');
        }
    </script>

</body>
</html>
