<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชำระเงิน - หมูกระทะย่างให้</title>
    <!-- ฟอนต์ Prompt สุดพรีเมียม -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #12080a;
            --card-bg: #1c1013;
            --card-border: #3d1c24;
            --maroon-accent: #8b0000;
            --gold-light: #ffd700;
            --text-main: #ffffff;
            --text-sub: #d1c4c6;
        }

        * { box-sizing: border-box; transition: all 0.25s ease; }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(218, 41, 28, 0.2), transparent 60%),
                linear-gradient(rgba(18, 8, 10, 0.92), rgba(18, 8, 10, 0.96)),
                url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        nav { 
            background: rgba(28, 16, 19, 0.92);
            backdrop-filter: blur(10px);
            padding: 16px 30px; 
            display: flex; 
            justify-content: center; 
            gap: 35px; 
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
            border-bottom: 2px solid var(--maroon-accent);
        }
        nav a { color: var(--text-sub); text-decoration: none; font-weight: 500; font-size: 17px; }
        nav a:hover, nav a.active { color: var(--gold-light); }

        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
        }

        h2 { color: #ffffff; text-align: center; margin-top: 0; margin-bottom: 25px; }

        .cart-summary {
            background: #12080a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .cart-summary h3 { margin-top: 0; color: var(--gold-light); font-size: 1.2rem; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
        .cart-item-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: var(--text-sub); }
        .cart-total-row { display: flex; justify-content: space-between; margin-top: 15px; font-size: 1.2rem; font-weight: 700; color: var(--gold-light); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-sub); }
        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: #12080a;
            color: white;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            outline: none;
        }
        .form-control:focus { border-color: var(--gold-light); }

        .bank-info-box {
            background: rgba(255, 215, 0, 0.05);
            border: 1px dashed var(--gold-light);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--text-sub);
            text-align: center;
        }
        .bank-info-box span { color: var(--gold-light); font-weight: bold; }

        .btn-submit {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #12080a;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-family: 'Prompt', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        .btn-submit:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <!-- Navbar สำหรับลูกค้า (ไม่มีปุ่มจัดการระบบ) -->
    <nav>
        <a href="index.html">🏠 หน้าแรก</a>
        <a href="products.html">🍖 เมนูอาหาร</a>
        <a href="checkout.html" class="active">🛒 ตะกร้าสินค้า & ชำระเงิน</a>
    </nav>

    <div class="container">
        <h2>🛒 ตะกร้าสินค้าและการชำระเงิน</h2>

        <!-- สรุปรายการสินค้า -->
        <div class="cart-summary">
            <h3>📦 รายการสินค้าของคุณ</h3>
            <div id="checkout-items-list">
                <!-- รายการจะถูกโหลดมาตรงนี้ -->
            </div>
            <div class="cart-total-row">
                <span>ยอดชำระสุทธิ:</span>
                <span id="checkout-total-price">0 ฿</span>
            </div>
        </div>

        <!-- ฟอร์มกรอกข้อมูล & ชำระเงิน -->
        <form id="checkout-form" onsubmit="submitOrder(event)">
            <div class="form-group">
                <label>👤 ชื่อ-นามสกุล ผู้รับ</label>
                <input type="text" id="cust-name" class="form-control" placeholder="กรอกชื่อ-นามสกุลของคุณ" required>
            </div>

            <div class="form-group">
                <label>📞 เบอร์โทรศัพท์ติดต่อ</label>
                <input type="tel" id="cust-phone" class="form-control" placeholder="เบอร์โทรศัพท์มือถือ" required>
            </div>

            <div class="form-group">
                <label>📍 ที่อยู่จัดส่ง</label>
                <textarea id="cust-address" class="form-control" rows="3" placeholder="บ้านเลขที่, ซอย, ถนน, ตำบล, จังหวัด..." required></textarea>
            </div>

            <!-- ช่องหมายเหตุเพิ่มเติม -->
            <div class="form-group">
                <label>📝 หมายเหตุเพิ่มเติม (ถ้ามี)</label>
                <textarea id="cust-note" class="form-control" rows="2" placeholder="เช่น ขอช้อนส้อม, เผ็ดน้อย, หรือจุดสังเกตเพิ่มเติม..."></textarea>
            </div>

            <div class="form-group">
                <label>💳 ช่องทางการชำระเงิน</label>
                <select id="payment-method" class="form-control" onchange="togglePaymentSection()">
                    <option value="โอนเงินผ่านธนาคาร">โอนเงินผ่านบัญชีธนาคาร (แนบสลิป)</option>
                    <option value="เก็บเงินปลายทาง">ชำระเงินสดปลายทาง (COD)</option>
                </select>
            </div>

            <div id="bank-section" class="bank-info-box">
                โอนเงินผ่านบัญชี: <span>ธนาคารไทยพาณิชย์ (SCB) 123-4-56789-0</span><br>
                ชื่อบัญชี: ร้านหมูกระทะย่างให้<br>
                <div style="margin-top: 10px;">
                    <label style="color: var(--text-main); font-size: 13px; display: block; margin-bottom: 5px;">📷 แนบสลิปการโอนเงิน:</label>
                    <input type="file" id="slip-file" class="form-control" accept="image/*" style="padding: 8px;">
                </div>
            </div>

            <button type="submit" class="btn-submit">✅ ยืนยันการสั่งซื้อ</button>
        </form>
    </div>

    <script>
        // โหลดข้อมูลตะกร้ามาแสดง
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const itemsListEl = document.getElementById('checkout-items-list');
        const totalPriceEl = document.getElementById('checkout-total-price');

        function renderCheckout() {
            itemsListEl.innerHTML = '';
            let total = 0;
            if (cart.length === 0) {
                itemsListEl.innerHTML = '<div class="cart-item-row"><span>ไม่มีสินค้าในตะกร้า</span><span>0 ฿</span></div>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    const row = document.createElement('div');
                    row.className = 'cart-item-row';
                    row.innerHTML = `<span>${item.name}</span><span>${item.price} ฿</span>`;
                    itemsListEl.appendChild(row);
                });
            }
            totalPriceEl.textContent = total + ' ฿';
        }

        function togglePaymentSection() {
            const method = document.getElementById('payment-method').value;
            const bankSection = document.getElementById('bank-section');
            if (method === 'เก็บเงินปลายทาง') {
                bankSection.style.display = 'none';
            } else {
                bankSection.style.display = 'block';
            }
        }

        function submitOrder(event) {
            event.preventDefault();
            if (cart.length === 0) {
                alert('กรุณาเลือกสินค้าก่อนทำการสั่งซื้อ!');
                return;
            }

            const orderData = {
                name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                address: document.getElementById('cust-address').value,
                note: document.getElementById('cust-note').value,
                paymentMethod: document.getElementById('payment-method').value,
                items: cart,
                total: cart.reduce((sum, item) => sum + item.price, 0),
                date: new Date().toLocaleString()
            };

            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.push(orderData);
            localStorage.setItem('orders', JSON.stringify(orders));

            localStorage.removeItem('cart');

            alert('🎉 สั่งซื้อสินค้าเรียบร้อยแล้ว ขอบคุณที่ใช้บริการครับ!');
            window.location.href = 'index.html';
        }

        renderCheckout();
    </script>
</body>
</html>
