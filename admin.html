<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลังบ้าน (Admin) - หมูกระทะย่างให้</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #12080a;
            --card-bg: #1c1013;
            --card-border: #3d1c24;
            --maroon-accent: #8b0000;
            --gold-light: #ffd700;
            --text-main: #ffffff;
            --text-sub: #d1c4c6;
        }

        * { box-sizing: border-box; transition: all 0.25s ease; }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(218, 41, 28, 0.2), transparent 60%),
                linear-gradient(rgba(18, 8, 10, 0.92), rgba(18, 8, 10, 0.96)),
                url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Navbar หลังบ้าน (แสดงโลโก้ร้าน + MOOKATA ADMIN) */
        nav { 
            background: rgba(28, 16, 19, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 30px; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
            border-bottom: 2px solid var(--maroon-accent);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-light);
        }
        .nav-title-text {
            color: var(--gold-light);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        nav a { 
            color: var(--text-sub); 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 15px; 
            background: rgba(255,255,255,0.05); 
            padding: 8px 16px; 
            border-radius: 20px; 
            border: 1px solid var(--card-border); 
        }
        nav a:hover { color: var(--gold-light); border-color: var(--gold-light); }

        .container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px;
        }

        h2.page-title { text-align: center; color: var(--gold-light); margin-bottom: 25px; }

        /* 📊 แผงสถิติ 5 ช่องด้านบน */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .stat-card h4 { margin: 0 0 10px 0; color: var(--text-sub); font-size: 0.95rem; font-weight: 500; }
        .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--gold-light); }

        /* ปุ่มล้างข้อมูล */
        .action-bar {
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
        }
        .btn-danger {
            background: #5c061c;
            color: white;
            border: 1px solid #8b0000;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
        }
        .btn-danger:hover { background: #800020; }

        /* ตารางแสดงออเดอร์ (รองรับเลื่อนซ้ายขวาบนจอมือถือ) */
        .table-responsive {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 40px;
        }
        table {
            width: 100%;
            min-width: 950px;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: rgba(139, 0, 0, 0.4);
            color: var(--gold-light);
            padding: 14px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--maroon-accent);
            white-space: nowrap;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-sub);
            vertical-align: top;
        }
        tr:hover { background: rgba(255,255,255,0.02); }

        .select-status {
            background: #12080a;
            color: white;
            border: 1px solid var(--card-border);
            padding: 8px;
            border-radius: 8px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .select-status:focus { border-color: var(--gold-light); }

        .btn-delete-row {
            background: #5c061c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete-row:hover { background: #800020; }

        .no-orders {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">
            <img src="logo.jpg" alt="Logo" class="nav-logo" onerror="this.src='https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=200&auto=format&fit=crop'">
            <span class="nav-title-text">MOOKATA ADMIN</span>
        </div>
        <a href="index.html">🏠 กลับสู่หน้าเว็บไซต์</a>
    </nav>

    <div class="container">
        <h2 class="page-title">🛡️ ระบบจัดการหลังบ้าน (ตรวจสอบออเดอร์และยอดขาย)</h2>

        <!-- 📊 กล่องสรุปสถานะ 5 ช่อง -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>📦 ออเดอร์ทั้งหมด</h4>
                <div id="stat-total" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <h4>👍 รับออเดอร์แล้ว</h4>
                <div id="stat-accepted" class="stat-value" style="color: #4cd137;">0</div>
            </div>
            <div class="stat-card">
                <h4>🚚 จัดส่งแล้ว</h4>
                <div id="stat-shipped" class="stat-value" style="color: #00cec9;">0</div>
            </div>
            <div class="stat-card">
                <h4>💰 ยอดขายรวม</h4>
                <div id="stat-sales" class="stat-value">0 ฿</div>
            </div>
            <div class="stat-card">
                <h4>❌ ยกเลิก</h4>
                <div id="stat-cancelled" class="stat-value" style="color: #ff7675;">0</div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-danger" onclick="clearAllOrders()">🗑️ ล้างประวัติออเดอร์ทั้งหมด</button>
        </div>

        <!-- ตารางจัดการออเดอร์ -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#ออเดอร์</th>
                        <th>ชื่อผู้รับ / โทร</th>
                        <th>รายการสินค้า</th>
                        <th>ที่อยู่จัดส่ง & หมายเหตุ</th>
                        <th>การชำระเงิน</th>
                        <th>ราคารวม</th>
                        <th>สถานะออเดอร์</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="admin-orders-tbody">
                    <!-- โหลดข้อมูลด้วย JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadAdminOrders() {
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            const tbody = document.getElementById('admin-orders-tbody');
            
            let totalOrders = orders.length;
            let acceptedCount = 0;
            let shippedCount = 0;
            let cancelledCount = 0;
            let totalSales = 0;

            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="no-orders">ยังไม่มีคำสั่งซื้อในระบบ...</td></tr>`;
                updateStats(0, 0, 0, 0, 0);
                return;
            }

            orders.forEach((order, index) => {
                let orderTotal = parseFloat(order.total);
                if (isNaN(orderTotal) && order.items) {
                    orderTotal = order.items.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0);
                }
                if (isNaN(orderTotal)) orderTotal = 0;

                const currentStatus = order.status || "กำลังเตรียมวัตถุดิบ";

                if (currentStatus === "รับออเดอร์แล้ว") acceptedCount++;
                if (currentStatus === "จัดส่งสำเร็จ" || currentStatus === "กำลังจัดส่ง") shippedCount++;
                if (currentStatus === "ยกเลิก") {
                    cancelledCount++;
                } else {
                    totalSales += orderTotal;
                }

                let itemsListHtml = order.items ? order.items.map(i => `• ${i.name} (${i.price || 0} ฿)`).join('<br>') : 'ไม่มีรายการ';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${order.id || ('#ORD-' + (1000 + index))}</strong><br><span style="font-size:11px; color:#aaa;">${order.date || 'วันนี้'}</span></td>
                    <td><strong>${order.name}</strong><br>📞 ${order.phone}</td>
                    <td style="font-size: 13px;">${itemsListHtml}</td>
                    <td>${order.address} ${order.note ? '<br><span style="color:var(--gold-light);">📝 ' + order.note + '</span>' : ''}</td>
                    <td>${order.paymentMethod}</td>
                    <td><strong style="color:var(--gold-light);">${orderTotal} ฿</strong></td>
                    <td>
                        <select class="select-status" onchange="updateOrderStatus(${index}, this.value)">
                            <option value="กำลังเตรียมวัตถุดิบ" ${currentStatus === 'กำลังเตรียมวัตถุดิบ' ? 'selected' : ''}>⏳ กำลังเตรียมวัตถุดิบ</option>
                            <option value="รับออเดอร์แล้ว" ${currentStatus === 'รับออเดอร์แล้ว' ? 'selected' : ''}>👍 รับออเดอร์แล้ว</option>
                            <option value="กำลังย่างบนเตา" ${currentStatus === 'กำลังย่างบนเตา' ? 'selected' : ''}>🔥 กำลังย่างบนเตา</option>
                            <option value="กำลังจัดส่ง" ${currentStatus === 'กำลังจัดส่ง' ? 'selected' : ''}>🛵 กำลังจัดส่ง</option>
                            <option value="จัดส่งสำเร็จ" ${currentStatus === 'จัดส่งสำเร็จ' ? 'selected' : ''}>✅ จัดส่งสำเร็จ</option>
                            <option value="ยกเลิก" ${currentStatus === 'ยกเลิก' ? 'selected' : ''}>❌ ยกเลิก</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-delete-row" onclick="deleteOrder(${index})">ลบ</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            updateStats(totalOrders, acceptedCount, shippedCount, totalSales, cancelledCount);
        }

        function updateStats(total, accepted, shipped, sales, cancelled) {
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-accepted').textContent = accepted;
            document.getElementById('stat-shipped').textContent = shipped;
            document.getElementById('stat-sales').textContent = sales.toLocaleString() + ' ฿';
            document.getElementById('stat-cancelled').textContent = cancelled;
        }

        function updateOrderStatus(index, newStatus) {
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            if (orders[index]) {
                orders[index].status = newStatus;
                localStorage.setItem('orders', JSON.stringify(orders));
                loadAdminOrders();
            }
        }

        function deleteOrder(index) {
            if (confirm('คุณต้องการลบออเดอร์นี้ใช่หรือไม่?')) {
                let orders = JSON.parse(localStorage.getItem('orders')) || [];
                orders.splice(index, 1);
                localStorage.setItem('orders', JSON.stringify(orders));
                loadAdminOrders();
            }
        }

        function clearAllOrders() {
            if (confirm('⚠️ คุณแน่ใจหรือไม่ที่จะลบประวัติออเดอร์ทั้งหมด?')) {
                localStorage.removeItem('orders');
                loadAdminOrders();
            }
        }

        loadAdminOrders();
    </script>
</body>
</html>
