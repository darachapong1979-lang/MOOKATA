<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลังบ้าน (Admin) - หมูกระทะย่างให้</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #12080a;
            --card-bg: #1c1013;
            --card-border: #3d1c24;
            --maroon-accent: #8b0000;
            --gold-light: #ffd700;
            --text-main: #ffffff;
            --text-sub: #d1c4c6;
        }

        * { box-sizing: border-box; transition: all 0.25s ease; }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(218, 41, 28, 0.2), transparent 60%),
                linear-gradient(rgba(18, 8, 10, 0.92), rgba(18, 8, 10, 0.96)),
                url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        nav { 
            background: rgba(28, 16, 19, 0.92);
            backdrop-filter: blur(10px);
            padding: 16px 30px; 
            display: flex; 
            justify-content: center; 
            gap: 35px; 
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
            border-bottom: 2px solid var(--maroon-accent);
        }
        nav a { color: var(--text-sub); text-decoration: none; font-weight: 500; font-size: 17px; }
        nav a:hover, nav a.active { color: var(--gold-light); }

        .container { 
            max-width: 1200px; 
            margin: 40px auto; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
        }

        h2 { color: #ffffff; text-align: center; margin-top: 0; margin-bottom: 25px; font-weight: 600; }

        .stats-box { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: #12080a; 
            border: 1px solid var(--card-border);
            border-left: 5px solid var(--gold-light); 
            padding: 20px; 
            border-radius: 12px; 
            flex: 1; 
            text-align: center; 
        }
        .stat-card p { margin: 0 0 8px 0; color: var(--text-sub); font-size: 15px; }
        .stat-card h3 { margin: 0; color: var(--gold-light); font-size: 26px; font-weight: 700; }

        .btn-clear { 
            background: rgba(255,255,255,0.08); 
            color: #ff6b6b; 
            border: 1px solid rgba(255,107,107,0.3); 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-family: 'Prompt', sans-serif;
            font-weight: 500; 
            margin-bottom: 20px; 
            font-size: 14px;
        }
        .btn-clear:hover { background: rgba(255, 107, 107, 0.2); }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            margin-top: 15px; 
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        th, td { padding: 14px 16px; text-align: left; font-size: 14px; }
        th { background-color: var(--maroon-accent); color: #ffffff; font-weight: 600; }
        td { background-color: #12080a; color: var(--text-sub); border-bottom: 1px solid rgba(255,255,255,0.05); }

        td ul { margin: 0; padding-left: 18px; color: #ffffff; }
        td ul li { margin-bottom: 4px; }

        .btn-action { 
            background-color: rgba(255, 107, 107, 0.15); 
            color: #ff6b6b; 
            border: 1px solid rgba(255, 107, 107, 0.3); 
            padding: 6px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            font-family: 'Prompt', sans-serif;
            margin-top: 5px;
        }
        .btn-action:hover { background-color: rgba(255, 107, 107, 0.3); }

        .btn-slip {
            background-color: rgba(33, 150, 243, 0.15);
            color: #64b5f6;
            border: 1px solid rgba(33, 150, 243, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            display: inline-block;
            margin-top: 6px;
        }
        .btn-slip:hover { background-color: rgba(33, 150, 243, 0.3); }

        .status-select {
            padding: 6px 10px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            outline: none;
            margin-top: 6px;
        }
        
        .status-pending { background-color: rgba(255, 152, 0, 0.2); color: #ffb74d; border-color: #ff9800; }
        .status-done { background-color: rgba(33, 150, 243, 0.2); color: #64b5f6; border-color: #2196f3; }
        .status-delivered { background-color: rgba(76, 175, 80, 0.2); color: #81c784; border-color: #4caf50; }
        .status-canceled { background-color: rgba(244, 67, 54, 0.2); color: #e57373; border-color: #f44336; }

        .pay-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .pay-cod { background: rgba(255,193,7,0.15); color: #ffc107; border: 1px solid rgba(255,193,7,0.3); }
        .pay-transfer { background: rgba(0,230,118,0.15); color: #00e676; border: 1px solid rgba(0,230,118,0.3); }

        /* Modal สำหรับแสดงรูปสลิป */
        #slip-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        #slip-modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            border: 2px solid var(--gold-light);
        }
        .close-modal {
            position: absolute;
            top: 20px; right: 30px;
            color: white; font-size: 35px; font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">🏠 หน้าแรก</a>
        <a href="products.html">🍖 เมนูอาหาร</a>
        <a href="checkout.html">🛒 ตะกร้าสินค้า</a>
        <a href="admin.html" class="active">⚙️ จัดการระบบ (Admin)</a>
    </nav>

    <div class="container">
        <h2>⚙️ ระบบจัดการหลังบ้าน (ตรวจสอบออเดอร์และการชำระเงิน)</h2>
        
        <div class="stats-box">
            <div class="stat-card">
                <p>จำนวนออเดอร์ทั้งหมด</p>
                <h3 id="total-orders">0</h3>
            </div>
            <div class="stat-card" style="border-left-color: #2e7d32;">
                <p>ยอดขายรวมทั้งหมด</p>
                <h3 id="total-sales">0 ฿</h3>
            </div>
        </div>

        <button class="btn-clear" onclick="clearAllOrders()">🗑️ ล้างประวัติออเดอร์ทั้งหมด</button>

        <table>
            <thead>
                <tr>
                    <th>#ออเดอร์</th>
                    <th>ชื่อผู้รับ / โทร</th>
                    <th>รายการสินค้า</th>
                    <th>ที่อยู่จัดส่ง</th>
                    <th>การชำระเงิน / สลิป</th>
                    <th>ราคารวม</th>
                    <th>สถานะออเดอร์</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody id="order-table-body">
                <tr>
                    <td colspan="8" style="text-align: center; color: var(--text-sub); padding: 30px;">ยังไม่มีรายการสั่งซื้อเข้ามา...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal สำหรับดูรูปสลิป -->
    <div id="slip-modal" onclick="closeSlipModal()">
        <span class="close-modal">&times;</span>
        <img id="modal-slip-img" src="" alt="สลิปโอนเงิน">
    </div>

    <script>
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            const tbody = document.getElementById('order-table-body');
            const totalOrdersEl = document.getElementById('total-orders');
            const totalSalesEl = document.getElementById('total-sales');

            tbody.innerHTML = '';
            let totalSales = 0;
            totalOrdersEl.textContent = orders.length;

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-sub); padding: 30px;">ยังไม่มีรายการสั่งซื้อเข้ามา...</td></tr>`;
                totalSalesEl.textContent = '0 ฿';
                return;
            }

            orders.forEach((order, index) => {
                totalSales += order.totalPrice;

                let itemsHtml = '<ul>';
                order.items.forEach(item => {
                    itemsHtml += `<li>${item.name} (${item.price} ฿)</li>`;
                });
                itemsHtml += '</ul>';

                const currentStatus = order.status || 'รอดำเนินการ (กำลังย่าง)';
                let statusClass = 'status-pending';
                if (currentStatus.includes('ย่างเสร็จ')) statusClass = 'status-done';
                if (currentStatus.includes('ส่งเรียบร้อย')) statusClass = 'status-delivered';
                if (currentStatus.includes('ยกเลิก')) statusClass = 'status-canceled';

                const paymentMethod = order.paymentMethod || 'โอนเงินผ่านธนาคาร';
                const payBadgeClass = paymentMethod.includes('ปลายทาง') ? 'pay-cod' : 'pay-transfer';
                
                let paymentHtml = `<span class="pay-badge ${payBadgeClass}">${paymentMethod}</span>`;
                if (order.slip) {
                    paymentHtml += `<br><button class="btn-slip" onclick="viewSlip('${order.slip}')">🔍 ตรวจสอบสลิป</button>`;
                } else if (!paymentMethod.includes('ปลายทาง')) {
                    paymentHtml += `<br><small style="color:#ff6b6b;">(ยังไม่แนบสลิป)</small>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong style="color:var(--gold-light);">#ORD-${1000 + index}</strong></td>
                    <td><span style="color:#ffffff; font-weight:500;">${order.name}</span><br><small style="color:var(--text-sub);">📞 ${order.phone}</small></td>
                    <td>${itemsHtml}</td>
                    <td><small style="color:var(--text-sub);">${order.address}</small></td>
                    <td>${paymentHtml}</td>
                    <td><strong style="color:var(--gold-light);">${order.totalPrice} ฿</strong></td>
                    <td>
                        <select class="status-select ${statusClass}" onchange="changeStatus(${index}, this.value)">
                            <option value="รอดำเนินการ (กำลังย่าง)" ${currentStatus === 'รอดำเนินการ (กำลังย่าง)' ? 'selected' : ''}>🔴 กำลังย่าง</option>
                            <option value="ย่างเสร็จแล้ว (กำลังจัดส่ง)" ${currentStatus === 'ย่างเสร็จแล้ว (กำลังจัดส่ง)' ? 'selected' : ''}>🟡 ย่างเสร็จ/กำลังส่ง</option>
                            <option value="ส่งเรียบร้อยแล้ว" ${currentStatus === 'ส่งเรียบร้อยแล้ว' ? 'selected' : ''}>🟢 ส่งเรียบร้อยแล้ว</option>
                            <option value="ยกเลิกออเดอร์ (สินค้าหมด)" ${currentStatus === 'ยกเลิกออเดอร์ (สินค้าหมด)' ? 'selected' : ''}>❌ ยกเลิก (สินค้าหมด)</option>
                        </select>
                    </td>
                    <td><button class="btn-action" onclick="deleteOrder(${index})">ลบ</button></td>
                `;
                tbody.appendChild(tr);
            });

            totalSalesEl.textContent = totalSales + ' ฿';
        }

        function viewSlip(slipDataUrl) {
            const modal = document.getElementById('slip-modal');
            const modalImg = document.getElementById('modal-slip-img');
            modalImg.src = slipDataUrl;
            modal.style.display = 'flex';
        }

        function closeSlipModal() {
            document.getElementById('slip-modal').style.display = 'none';
        }

        function changeStatus(index, newStatus) {
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders[index].status = newStatus;
            localStorage.setItem('orders', JSON.stringify(orders));
            loadOrders();
        }

        function deleteOrder(index) {
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.splice(index, 1);
            localStorage.setItem('orders', JSON.stringify(orders));
            loadOrders();
        }

        function clearAllOrders() {
            if (confirm('คุณต้องการล้างประวัติออเดอร์ทั้งหมดจริงหรือ?')) {
                localStorage.removeItem('orders');
                loadOrders();
            }
        }

        loadOrders();
    </script>
</body>
</html>
